name: Bug Report
description: Create a report to help us fix an issue or defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Environment & Browser
      description: OS, Browser name, and version where the issue occurred.
      placeholder: macOS Sequoia / Chrome 129
    validations:
      required: false
